<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نتائج الطلاب</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
<h1>نتائج الطلاب</h1>

<div class="form">
<input type="text" id="name" placeholder="اسم الطالب">
<input type="number" id="grade1" placeholder="درجة المادة 1">
<input type="number" id="grade2" placeholder="درجة المادة 2">
<input type="number" id="grade3" placeholder="درجة المادة 3">
<input type="number" id="attendance" placeholder="نسبة الحضور %">
<p id="error"></p>
<button onclick="addStudent()">إضافة طالب</button>
</div>

<table>
<thead>
<tr>
<th>الاسم</th>
<th>م1</th>
<th>م2</th>
<th>م3</th>
<th>المجموع</th>
<th>المتوسط</th>
<th>التقدير</th>
<th>الحضور</th>
</tr>
</thead>
<tbody id="results"></tbody>
</table>

</div>
<script src="js/main.js"></script>
</body>
</html>
